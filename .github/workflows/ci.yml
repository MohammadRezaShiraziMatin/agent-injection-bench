name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Validate episodes
        run: python scripts/validate_episodes.py
      - name: Pytest
        run: python -m pytest -q
        env:
          # Ensure CI never depends on live LLM credentials.
          AIB_LLM_API_KEY: ""
          OPENAI_API_KEY: ""
